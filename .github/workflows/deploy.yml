name: Deploy

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**/*.md"
      - "CODEOWNERS"
      - "Makefile"
  workflow_dispatch: {}

permissions:
  id-token: write # required by aws-actions/configure-aws-credentials for OIDC
  contents: read

jobs:
  deploy:
    name: Deploy to S3
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Set Node.js 18.x
        uses: actions/setup-node@v7
        with:
          node-version: 18.x

      - name: Run install
        uses: borales/actions-yarn@v5
        with:
          cmd: install

      - name: Fetch pinned brainrot.wasm
        uses: borales/actions-yarn@v5
        with:
          cmd: fetch-wasm

      - name: Build production bundle
        uses: borales/actions-yarn@v5
        with:
          cmd: build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Everything except index.html and .mjs: CRA content-hashes these
      # filenames (or, for the unhashed wasm/mjs assets, wasmWorker.ts
      # appends a `?v=` cache-buster), so long caching is safe.
      - name: Sync static assets (long-lived cache)
        run: |
          aws s3 sync build/ "s3://${{ secrets.S3_BUCKET }}" \
            --delete \
            --exclude "index.html" \
            --exclude "*.mjs" \
            --cache-control "public,max-age=31536000,immutable"

      # .mjs needs an explicit content-type: aws-cli's guessing doesn't
      # reliably map .mjs -> application/javascript, and the browser's
      # import() of brainrot.mjs fails silently if it's served as
      # anything else (see nginx.conf for the same fix under Docker).
      - name: Sync brainrot.mjs (explicit content-type)
        run: |
          aws s3 sync build/ "s3://${{ secrets.S3_BUCKET }}" \
            --delete \
            --exclude "*" \
            --include "*.mjs" \
            --content-type "application/javascript" \
            --cache-control "public,max-age=31536000,immutable"

      # index.html must never be cached: it's what points at the
      # (content-hashed) JS/CSS bundle for a given deploy.
      - name: Upload index.html (no-cache)
        run: |
          aws s3 cp build/index.html "s3://${{ secrets.S3_BUCKET }}/index.html" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        if: env.DISTRIBUTION_ID != ''
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
