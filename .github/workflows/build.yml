name: Build

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**/*.md"
      - "CODEOWNERS"
      - "Makefile"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "**/*.md"
      - "CODEOWNERS"
      - "Makefile"

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      
      - name: Enable Corepack
        run: corepack enable
      
      - name: Verify Yarn
        run: yarn --version
      
      - name: Install dependencies
        run: yarn install --immutable
      
      - name: Run unit tests
        run: yarn test --watchAll=false
      
      - name: Fetch pinned brainrot.wasm
        run: yarn fetch-wasm
      
      - name: Verify wasm runtime against the real artifact
        run: yarn verify:wasm
      
      - name: Build production bundle
        run: yarn build
