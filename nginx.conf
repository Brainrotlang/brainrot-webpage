# nginx.conf
#
# Overrides nginx:alpine's default server block for two reasons: the SPA
# fallback below, and mime types. On the latter: its default mime.types has
# no entry for .mjs, so brainrot.mjs was served as
# application/octet-stream — browsers refuse to dynamically import() a
# module with a non-JS MIME type, so wasmWorker.ts's `import(wasmBaseUrl +
# "brainrot.mjs")` silently failed under this config even though the file
# itself was served fine (200, correct bytes). The dev server (webpack-
# dev-server) sets the right type automatically, so this only ever shows
# up in a real nginx deployment — caught by actually running the built
# image, not by anything unit-testable. The same is true of the fallback:
# no unit test can tell you whether a deployed host resolves /tour/... .
#
# Everything else here matches nginx:alpine's stock default.conf.

server {
    listen       80;
    server_name  localhost;

    # try_files is the SPA fallback: /tour/basics/hello-world is a client
    # route, not a file on disk, so without it a refresh or a shared deep
    # link 404s even though the app handles the URL perfectly well once
    # loaded. The regex location below still wins for .mjs URLs — nginx
    # matches regex locations ahead of prefix ones — so this does not
    # swallow brainrot.mjs and hand back index.html with a JS mime type.
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.mjs$ {
        root         /usr/share/nginx/html;
        default_type application/javascript;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
